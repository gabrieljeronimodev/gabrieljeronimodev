# Arquivo: .github/workflows/snake.yml

name: Generate Snake Animation

on:
  schedule:
    # Roda automaticamente a cada 12 horas
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: gabrieljeronimodev
          outputs: |
            dist/github-snake.svg?color_snake=0052CC
            dist/github-snake-dark.svg?palette=github-dark&color_snake=4D9FFF

      - name: Push output to branch "output"
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
