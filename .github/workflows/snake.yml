# Arquivo: .github/workflows/snake.yml
# Coloque este arquivo dentro do repositório gabrieljeronimodev/gabrieljeronimodev
# em .github/workflows/snake.yml

name: Generate Snake Animation

on:
  schedule:
    # Roda automaticamente a cada 12 horas
    - cron: "0 */12 * * *"
  # Permite rodar manualmente pela aba Actions no GitHub
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: gabrieljeronimodev
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=4D9FFF

      - name: Push output to branch "output"
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
